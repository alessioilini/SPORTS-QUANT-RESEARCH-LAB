[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportslab"
version = "0.1.0"
description = "Sports Quant Research Lab: point-in-time sports data, probabilistic models, virtual-bankroll research simulations"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "historical: needs downloaded historical data (python scripts/fetch_data.py)",
  "network: needs outbound network to live sports APIs",
  "slow: long-running",
]
